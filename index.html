<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.0.5/swiper-bundle.css"
      integrity="sha512-pmAAV1X4Nh5jA9m+jcvwJXFQvCBi3T17aZ1KWkqXr7g/O2YMvO8rfaa5ETWDuBvRq6fbDjlw4jHL44jNTScaKg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./src/css/main.css" />
    <title>Ticket App</title>
  </head>
  <body>
    <header class="header">
      <div class="header__top">
        <div class="header__logo">
          <img
            src="https://www.mall28.az/storage/uploads/k6YjZ8BzjZAYo7oEofbLD51iSuvB5EwLCrowncEF.png"
            alt="Logo"
          />
        </div>
        <div class="header__icons">
          <div class="header__icon header__icon--favorites">
            <i class="fa-regular fa-heart"></i>
          </div>
          <div class="header__profile-info">
            <div class="header__icon-box">
              <div class="header__icon header__icon--profile">
                <i class="fa-regular fa-user"></i>
              </div>
              <div class="header__dropdown">
                <p>Profile</p>
                <p>Sign In</p>
                <p>Sign Up</p>
                <p>My Tickets</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="header__search-bar">
        <i class="header__search-icon fa-solid fa-magnifying-glass"></i>
        <input class="header__search-input" type="text" />
      </div>
    </header>
    <main>
      <section id="slider">
        <div class="slider">
          <div class="slider-wrapper">
            <div class="slide">
              <img
                src="https://cdn.iticket.az/event/slide/HGChA7tmv6gNZmz2OvNO5HrYDnKdkRq9eGgvexQN.jpg"
                alt="Slide 1"
              />
            </div>
            <div class="slide">
              <img
                src="https://cdn.iticket.az/event/slide/LF632wgmODEyU6H0Qzb5ldoEz4KR2fzHg6fX4hQr.jpg"
                alt="Slide 2"
              />
            </div>
            <div class="slide">
              <img src="https://via.placeholder.com/800x400" alt="Slide 3" />
            </div>
          </div>
          <button class="prev"><i class="fa-solid fa-angle-left"></i></button>
          <button class="next"><i class="fa-solid fa-angle-right"></i></button>
        </div>
      </section>
    </main>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.0.5/swiper-bundle.min.js"
      integrity="sha512-Ysw1DcK1P+uYLqprEAzNQJP+J4hTx4t/3X2nbVwszao8wD+9afLjBQYjz7Uk4ADP+Er++mJoScI42ueGtQOzEA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script type="module" src="./src/js/pages/home.js"></script>
  </body>
</html>
