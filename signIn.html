<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="./src/assets/images/ticket.png"
    />
    <link rel="stylesheet" href="./src/css/main.css" />
    <title>Ticket App</title>
  </head>
  <body id="sign">
    <header class="header">
      <div class="header__logo">
        <img
          src="https://www.mall28.az/storage/uploads/k6YjZ8BzjZAYo7oEofbLD51iSuvB5EwLCrowncEF.png"
          alt="Logo"
        />
      </div>
      <div class="header__icons">
        <div class="header__icon header__icon--favorites">
          <svg
            viewBox="0 0 24 24"
            width="1.5em"
            height="1.5em"
            aria-hidden="true"
            focusable="false"
            class="BaseSvg-sc-yh8lnd-0 HeartIcon___StyledBaseSvg-sc-1shonaa-0 ckLyyv"
          >
            <path
              d="M6.18 1.56 12 5.91l5.82-4.35L23 5.48v7.42l-11 9.6-11-9.6V5.48zm11.64 1.88L12 7.79 6.18 3.44 2.5 6.22v6L12 20.5l9.5-8.28v-6z"
            ></path>
          </svg>
          <!-- <i class="fa-regular fa-heart"></i> -->
        </div>
        <div class="header__profile-info">
          <div class="header__icon-box">
            <div class="header__icon header__icon--profile">
              <i class="fa-regular fa-user"></i>
            </div>
            <ul class="header__dropdown">
              <li><a href="./index.html">Home</a></li>
              <li><a href="./signIn.html">Sign In</a></li>
              <li><a href="./signUp.html">Sign Up</a></li>
              <li><a href="./events.html">Events</a></li>
            </ul>
          </div>
        </div>
      </div>
    </header>
    <main>
      <section class="sign">
        <div class="sign__image-box">
          <img src="./src/assets/images/signIn-img.jpeg" alt="Sign In Image" />
        </div>
        <div class="sign__form-box">
          <h2>Welcome Back</h2>
          <p>
            Discover millions of events, get alerts about your favorite artists,
            teams, plays and more — plus always- secure, effortless ticketing.
          </p>
          <p>New to Iticket? <a href="./signUp.html">Sign Up</a></p>
          <form class="sign__form">
            <input type="text" placeholder="Email" />
            <div class="password__input">
              <input type="password" placeholder="Password" />
              <i class="fa-regular fa-eye-slash"></i>
            </div>
            <button type="submit">Login</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
