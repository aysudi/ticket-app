<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="./src/assets/images/ticket.png"
    />
    <link rel="stylesheet" href="./src/css/main.css" />
    <title>Ticket App</title>
  </head>
  <body id="sign">
    <header class="header">
      <div class="header__logo">
        <img
          src="https://www.mall28.az/storage/uploads/k6YjZ8BzjZAYo7oEofbLD51iSuvB5EwLCrowncEF.png"
          alt="Logo"
        />
      </div>
      <div class="header__right">
        <div class="header__icons icon">
          <a href="./basket.html"><i class="fa-solid fa-cart-shopping"></i></a>
          <a href="./favorites.html"><i class="fa-regular fa-heart"></i></a>
        </div>
        <div class="header__profile">
          <div class="header__icon--profile icon">
            <i class="fa-regular fa-user"></i>
          </div>
          <ul class="header__dropdown">
            <li><a href="./index.html">Home</a></li>
            <li><a href="./signIn.html">Log In</a></li>
            <li><a href="./signUp.html">Sign Up</a></li>
            <li><a href="./events.html">Events</a></li>
          </ul>
        </div>
      </div>
    </header>
    <main>
      <section class="sign sign-up">
        <div class="sign__box">
          <div class="sign__image-box sign-up__img">
            <img src="./public/images/signUp-img.jpeg" alt="Sign Up Image" />
          </div>
          <div class="sign__form-box">
            <h2>Sign Up</h2>
            <p>
              Create a Iticket account. Already have an account?
              <a href="./signIn.html">Login</a>
            </p>
            <form class="sign__form sign-up__form">
              <input
                id="full-name"
                type="text"
                placeholder="Full Name"
                required
              />
              <input
                id="username"
                type="text"
                placeholder="Username"
                required
              />
              <input id="email" type="text" placeholder="Email" required />
              <div class="password__input">
                <input
                  id="password"
                  type="password"
                  placeholder="Password"
                  required
                />
                <i class="password-icon fa-regular fa-eye-slash"></i>
              </div>
              <div class="password__input">
                <input
                  id="confirm-password"
                  type="password"
                  placeholder="Confirm Password"
                  required
                />
                <i class="password-icon fa-regular fa-eye-slash"></i>
              </div>
              <button type="submit">Sign Up</button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./src/js/helpers/navbar.js"></script>
    <script type="module" src="./src/js/pages/register.js"></script>
  </body>
</html>
