<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="./src/assets/images/ticket.png"
    />
    <link rel="stylesheet" href="./src/css/main.css" />
    <title>Ticket App</title>
  </head>
  <body id="sign">
    <main>
      <section class="sign sign-up">
        <div class="sign__box">
          <div class="sign__image-box sign-up__img">
            <img
              src="./src/assets/images/signUp-img.jpeg"
              alt="Sign Up Image"
            />
          </div>
          <div class="sign__form-box">
            <h2>Sign Up</h2>
            <p>
              Create a Iticket account. Already have an account?
              <a href="./signIn.html">Login</a>
            </p>
            <form class="sign__form sign-up__form">
              <input type="text" placeholder="Full Name" />
              <input type="text" placeholder="Username" />
              <input type="text" placeholder="Email" />
              <div class="password__input">
                <input type="password" placeholder="Password" />
                <i class="fa-regular fa-eye-slash"></i>
              </div>
              <div class="password__input">
                <input type="password" placeholder="Confirm Password" />
                <i class="fa-regular fa-eye-slash"></i>
              </div>
              <button type="submit">Sign Up</button>
            </form>
          </div>
        </div>
        <a href="index.html" class="back sign__up-back">Home</a>
      </section>
    </main>
  </body>
</html>
